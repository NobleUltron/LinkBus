# ====================================================================
# LinkBus - XAMPP Apache Virtual Host Configuration
# ====================================================================
#
# To enable this virtual host in XAMPP:
# 1. Open: C:\xampp\apache\conf\extra\httpd-vhosts.conf
# 2. Add the configuration block below at the bottom of the file.
# 3. Add to your Windows hosts file (C:\Windows\System32\drivers\etc\hosts):
#       127.0.0.1  linkbus.local
# 4. Restart Apache in the XAMPP Control Panel.
# 5. Open your browser to: http://linkbus.local
# ====================================================================

<VirtualHost *:80>
    ServerName linkbus.local
    ServerAlias www.linkbus.local
    DocumentRoot "C:/xampp/htdocs/LinkBus/backend/public"

    <Directory "C:/xampp/htdocs/LinkBus/backend/public">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted

        # Rewrite all non-file/folder requests to index.php (Laravel & React SPA)
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    ErrorLog "C:/xampp/apache/logs/linkbus-error.log"
    CustomLog "C:/xampp/apache/logs/linkbus-access.log" combined
</VirtualHost>
