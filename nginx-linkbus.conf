# ====================================================================
# LinkBus - Production Nginx Server Block Configuration
# ====================================================================
# Place in: /etc/nginx/sites-available/linkbus.conf
# Enable: ln -s /etc/nginx/sites-available/linkbus.conf /etc/nginx/sites-enabled/
# SSL Certificate: sudo certbot --nginx -d linkbus.co.ug -d www.linkbus.co.ug
# ====================================================================

# HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name linkbus.co.ug www.linkbus.co.ug;
    return 301 https://$host$request_uri;
}

# Primary HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name linkbus.co.ug www.linkbus.co.ug;

    # Document Root points to Laravel's public directory (containing unified React SPA)
    root /var/www/linkbus/backend/public;
    index index.php index.html;

    # SSL Configuration (Populated by Certbot)
    # ssl_certificate /etc/letsencrypt/live/linkbus.co.ug/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/linkbus.co.ug/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    charset utf-8;
    client_max_body_size 64M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # Static Assets Fast Cache (1 Year)
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA & API Request Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Block access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Logging
    access_log /var/log/nginx/linkbus-access.log;
    error_log /var/log/nginx/linkbus-error.log error;
}
