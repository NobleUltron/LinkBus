# ====================================================================
# LinkBus - Render.com Infrastructure Blueprint
# ====================================================================
# This file defines your entire Render.com deployment.
# Connect your GitHub repo to Render and it deploys automatically.
# ====================================================================

services:
  # ── LinkBus Web Application (React Frontend + Laravel Backend) ──────
  - type: web
    name: linkbus-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt  # Closest to East Africa

    # Auto-deploy when you push to GitHub
    autoDeploy: true

    # Environment Variables (Set SECRET values in Render dashboard)
    envVars:
      - key: APP_NAME
        value: "LinkBus Services"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          type: web
          name: linkbus-app
          property: host
      - key: APP_KEY
        generateValue: true  # Render auto-generates a secure key

      # Database (TiDB Cloud Serverless - Free MySQL)
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false  # Set manually in Render Dashboard from TiDB
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: linkbus_prod
      - key: DB_USERNAME
        sync: false  # Set manually in Render Dashboard
      - key: DB_PASSWORD
        sync: false  # Set manually in Render Dashboard

      # Session & Cache (file-based for free tier)
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

      # CORS (Your Render URL)
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Set to https://your-app.onrender.com in Dashboard

      # Mail (Optional - Set in Dashboard)
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_FROM_ADDRESS
        value: "no-reply@linkbus.co.ug"
      - key: MAIL_FROM_NAME
        value: "LinkBus Uganda"

      # WhatsApp (Optional - Set in Dashboard)
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
